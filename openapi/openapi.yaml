      type: object
      required: [asset, price, decimals]
      properties:
        asset: {type: string}
        price: {type: string}
        decimals: {type: integer, minimum: 0}
    SEP38PriceResponse:
      type: object
      required: [total_price, price, sell_asset, sell_amount, buy_asset, buy_amount]
      properties:
        total_price: {type: string}
        price: {type: string}
        sell_asset: {type: string}
        sell_amount: {type: string}
        buy_asset: {type: string}
        buy_amount: {type: string}
    SEP38QuoteRequest:
      type: object
      additionalProperties: false
      required: [sell_asset, buy_asset]
      properties:
        sell_asset: {type: string, enum: [iso4217:IDR, stellar:native]}
        buy_asset: {type: string, enum: [iso4217:IDR, stellar:native]}
        sell_amount:
          type: string
          description: Exact amount on the sell side. Provide exactly one of sell_amount or buy_amount.
        buy_amount:
          type: string
          description: Exact amount on the buy side. Provide exactly one of sell_amount or buy_amount.
        sell_delivery_method: {type: string}
        buy_delivery_method: {type: string}
    SEP38QuoteResponse:
      type: object
      required: [id, quote_id, sell_asset, buy_asset, sell_amount, buy_amount, price, expires_at]
      properties:
        id: {type: string}
        quote_id: {type: string}
        sell_asset: {type: string}
        buy_asset: {type: string}
        sell_amount: {type: string}
        buy_amount: {type: string}
        price: {type: string}
        spread_bps: {type: integer, minimum: 0}
        delivery_method: {type: string}
        sell_delivery_method: {type: string}
        buy_delivery_method: {type: string}
        expires_at: {type: string, format: date-time}
    SEP38Error:
      type: object
      required: [error, request_id]
      properties:
        error: {type: string}
        request_id: {type: string}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OnrampError:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_STELLAR_ACCOUNT, AMOUNT_OUT_OF_RANGE, INSUFFICIENT_LIQUIDITY,
                     IDEMPOTENCY_KEY_REUSED, ORDER_NOT_FOUND, CHECKOUT_PENDING_RECONCILIATION,
                     QUOTE_UNAVAILABLE, EXTERNAL_SERVICE_UNAVAILABLE, KYC_REQUIRED]
            message:
              type: string
        request_id:
          type: string
        order_id:
          type: string
          format: uuid
          description: Durable order identifier returned when checkout creation has an unknown provider outcome; poll GET /v1/orders/{id}.
    XenditCallbackRequest:
      oneOf:
        - $ref: '#/components/schemas/XenditPaymentSessionCallback'
        - $ref: '#/components/schemas/XenditPaymentCaptureCallback'
    XenditPaymentSessionCallback:
      type: object
      additionalProperties: true
      required: [event, data]
      properties:
        event:
          type: string
          enum: [payment_session.completed, payment_session.expired]
        data:
          type: object
          additionalProperties: true
          anyOf:
            - required: [payment_session_id]
            - required: [id]
          properties:
            id:
              type: string
              description: Payment Session identifier used by the Xendit dashboard test fixture.
            payment_session_id:
              type: string
              description: Payment Session identifier used by the provider callback payload.
    XenditPaymentCaptureCallback:
      type: object
      additionalProperties: true
      required: [event, data]
      properties:
        event:
          type: string
          enum: [payment.capture]
        data:
          type: object
          additionalProperties: true
          required: [payment_id]
          anyOf:
            - required: [payment_session_id]
            - required: [payment_request_id]
          properties:
            payment_id:
              type: string
            payment_session_id:
              type: string
            payment_request_id:
              type: string
