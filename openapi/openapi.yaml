      oneOf:
        - $ref: '#/components/schemas/SEP38BuyPricesResponse'
        - $ref: '#/components/schemas/SEP38SellPricesResponse'
    SEP38BuyPricesResponse:
      type: object
      required: [buy_assets]
      properties:
        buy_assets:
          type: array
          items:
            $ref: '#/components/schemas/SEP38AssetPrice'
