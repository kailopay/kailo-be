    SEP24AssetInfoMap:
      type: object
      required: [XLM]
      properties:
        XLM:
          type: object
          required: [enabled, min_amount, max_amount, amount_unit, fiat_currency]
          properties:
            enabled: {type: boolean}
            min_amount: {type: number}
            max_amount: {type: number}
            amount_unit: {type: string, enum: [XLM, idr_minor]}
            fiat_currency: {type: string, enum: [IDR]}
    SEP24DepositRequest:
      type: object
      additionalProperties: false
      required: [asset_code, account]
      properties:
        asset_code: {type: string, enum: [XLM]}
        amount_minor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Positive IDR minor units; required unless quote_id is supplied.
        account:
          type: string
          minLength: 56
          maxLength: 56
          description: Stellar testnet destination account.
        memo: {type: string, maxLength: 28}
        memo_type: {type: string, enum: [text]}
        payment_method: {type: string, enum: [xendit, qris, bri_va]}
        quote_id:
          type: string
          description: Optional authenticated firm SEP-38 quote owned by the wallet.
    SEP24WithdrawRequest:
      type: object
      additionalProperties: false
      required: [asset_code, amount, destination_token]
      properties:
        asset_code: {type: string, enum: [XLM]}
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,7})?$'
          description: Positive exact XLM amount with up to 7 fractional digits.
        destination_token:
          type: string
          minLength: 1
          maxLength: 200
          description: Synthetic sandbox destination reference; never real bank details.
        quote_id:
          type: string
          description: Optional authenticated firm SEP-38 quote owned by the wallet.
    SEP24StartResponse:
      type: object
      required: [type, url, id, kyc_required, environment, network]
      properties:
        type: {type: string, enum: [interactive_customer_info_needed]}
        url: {type: string, format: uri}
        id: {type: string}
        kyc_required: {type: boolean}
        environment: {type: string, enum: [sandbox]}
        network: {type: string, enum: [stellar_testnet]}
        payment_link_url: {type: string, format: uri}
    SEP24Transaction:
      type: object
      required: [id, kind, status, started_at, updated_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [deposit, withdrawal]}
        status:
          type: string
          enum: [pending_user_transfer_start, pending_anchor, pending_external, completed, expired, error]
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        stellar_transaction_id: {type: string}
        withdraw_anchor_account: {type: string}
        withdraw_memo: {type: string}
        withdraw_memo_type: {type: string, enum: [text]}
        amount_in: {type: string}
        amount_out: {type: string}
        quote_id: {type: string}
        external_transaction_id: {type: string}
        sandbox_disclosure:
          type: string
          description: Present for the simulated testnet payout and explicitly states that no real IDR moved.
        more_info_url: {type: string, format: uri}
    SEP24TransactionResponse:
      type: object
      required: [transaction]
      properties:
        transaction:
          $ref: '#/components/schemas/SEP24Transaction'
    SEP24TransactionListResponse:
      type: object
      required: [transactions]
      properties:
        transactions:
          type: array
          items:
            $ref: '#/components/schemas/SEP24Transaction'
    SEP24InteractiveResponse:
      type: object
      required: [environment, network, kyc_required]
      properties:
