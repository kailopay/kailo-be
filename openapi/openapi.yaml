openapi: 3.0.3
info:
  title: KailoPay Backend API
  version: 0.1.0
  description: Sandbox/testnet payment API with self-hosted email and Google authentication behind KailoPay-owned sessions.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /auth/register:
    post:
      summary: Create an email account
      description: Creates an unverified credentials account and issues a single-use verification token. The verification link is delivered by the configured sender (logged to the server console in sandbox).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; verification required before login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid JSON, email, or password (10-128 characters required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Sign in with email and password
      description: Verifies credentials and sets the opaque session cookie. Unknown emails and wrong passwords both return 401 without distinguishing the cause.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user with session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly, SameSite=Lax local session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid email or password, or account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email is not verified yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/login:
    get:
      summary: Start Google sign-in
      description: Redirects the browser to Google's OIDC authorization endpoint with PKCE. Returns 503 when Google credentials are not configured.
      responses:
        '302':
          description: Redirect to Google
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          description: Google sign-in is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/callback:
    get:
      summary: Complete Google sign-in
      description: Exchanges the Google authorization code and redirects to the frontend with a local session cookie. A Google identity whose verified email matches an existing account is linked to that account.
      responses:
        '302':
          description: Redirect to the configured frontend success URL
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly, SameSite=Lax local session cookie.
        '400':
          description: Invalid, expired, or replayed authentication callback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: End the local session
      description: Revokes the KailoPay session represented by the browser cookie and clears that cookie.
      responses:
        '204':
          description: Session ended or was already absent
        '500':
          description: Session revocation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/verify:
    post:
      summary: Verify an email address
      description: Consumes the single-use verification token from the register or resend flow.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenRequest'
      responses:
        '200':
          description: Verified profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid, expired, or already used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/resend:
    post:
      summary: Resend the verification email
      description: Always returns 202 regardless of whether the account exists or is already verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The request was accepted without disclosing account existence
        '400':
          description: Invalid JSON or email syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/forgot:
    post:
      summary: Request a password-reset email
      description: Issues a single-use reset token valid for one hour. A valid request always returns 202 regardless of whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The request was accepted without disclosing account existence
        '400':
          description: Invalid JSON or email syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/reset:
    post:
      summary: Reset the password with a token
      description: Consumes the reset token, stores a new Argon2id hash, and revokes every session for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password updated; all sessions revoked
        '400':
          description: Invalid token or password policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/change:
    post:
      summary: Change the password of the signed-in account
      description: Requires the current password, stores the new hash, and revokes every session including the current one.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; sign in again
        '401':
          description: Missing session or wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid JSON or password policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      summary: Get the authenticated local user
      security:
        - kailoSession: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing, expired, revoked, or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update the authenticated local profile
      description: Updates the local display name and Developer Mode opt-in. Email and verification status are managed by the authentication flows.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid display name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me/avatar:
    get:
      summary: Read the authenticated user's private avatar
      security:
        - kailoSession: []
      responses:
        '200':
          description: Avatar bytes streamed from private object storage
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid local session
        '404':
          description: The user has no avatar
    put:
      summary: Replace the authenticated user's avatar
      description: Accepts one JPEG, PNG, or WebP image up to the configured size limit and stores it in the private MinIO bucket.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid image or multipart request
        '401':
          description: Missing or invalid local session
        '413':
          description: Avatar exceeds the configured size limit
    delete:
      summary: Delete the authenticated user's avatar
      security:
        - kailoSession: []
      responses:
        '200':
          description: Updated profile without an avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid local session
  /v1/api-keys:
    post:
      summary: Create a sandbox API key
      description: Requires Developer Mode. The full key is returned only in this response.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '403':
          description: Developer Mode is disabled
    get:
      summary: List sandbox API keys
      security:
        - kailoSession: []
      responses:
        '200':
          description: API-key metadata without secret values
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKeyMetadata'
  /v1/api-keys/{id}:
    delete:
      summary: Revoke a sandbox API key
      security:
        - kailoSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key revoked
        '404':
          description: Key not found for this user
  /v1/onramps:
    post:
      summary: Create an IDR to native-XLM sandbox on-ramp
      description: |
        Accepts either an API-key principal or a verified retail session
        principal. For a session-authenticated browser mutation, `Origin`
        must exactly match a configured frontend origin; when `Origin` is
        absent, an equivalent `Referer` origin is accepted.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnrampRequest'
      responses:
        '200':
          description: Idempotent replay of a previously completed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '201':
          description: Treasury inventory reserved and Xendit hosted checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '202':
          description: Checkout outcome is pending provider reconciliation (CHECKOUT_PENDING_RECONCILIATION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '400':
          description: Malformed request (INVALID_REQUEST) or invalid Stellar destination (INVALID_STELLAR_ACCOUNT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '401':
          description: Missing or invalid API key/session credentials
        '403':
          description: Verified session is required for consumer orders, or the browser origin is not allowed
        '409':
          description: Idempotency conflict (IDEMPOTENCY_KEY_REUSED) or insufficient liquidity (INSUFFICIENT_LIQUIDITY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '415':
          description: Content type is not application/json
        '422':
          description: Amount outside the supported range (AMOUNT_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '503':
          description: Quote unavailable (QUOTE_UNAVAILABLE) or an external service is unavailable (EXTERNAL_SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
  /v1/offramps:
    post:
      summary: Create an XLM to IDR sandbox off-ramp (simulated payout)
      description: |
        Prices the sell order against current market data, then returns
        deterministic deposit instructions: send exactly the quoted XLM amount
        to the deposit account using the returned memo before expiry. After
        verification and on-chain retirement, a simulated IDR payout reference
        is recorded; no real IDR moves in the sandbox release. Accepts either
        an API-key principal or a verified retail session principal. A
        session-authenticated browser mutation requires an exact configured
        `Origin`, or a matching `Referer` origin when `Origin` is absent.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfframpRequest'
      responses:
        '200':
          description: Idempotent replay of a previously completed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '201':
          description: Order created with deposit instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Malformed request or invalid withdrawal payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '401':
          description: Missing or invalid API key/session credentials
        '403':
          description: Verified session is required for consumer orders, or the browser origin is not allowed
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '422':
          description: Resulting payout outside the supported range (AMOUNT_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '503':
          description: Quote unavailable or external service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
  /v1/orders:
    get:
      summary: List orders owned by the authenticated principal
      description: API keys list their client-owned orders; retail sessions list that verified user's consumer orders across valid sessions.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Orders owned by the authenticated API client or retail user
          content:
            application/json:
              schema:
                type: object
                required: [orders, next_cursor]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    type: string
  /v1/orders/{id}:
    get:
      summary: Get one order owned by the authenticated principal
      description: Returns 404 when the order does not exist or belongs to a different API client, retail user, or owner scope.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid API key/session credentials
        '404':
          description: Missing or cross-client order (ORDER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
  /callbacks/payments/xendit:
    post:
      summary: Receive an authenticated Xendit payment webhook
      security:
        - xenditCallback: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Callback accepted, replayed, or safely retained
        '401':
          description: Invalid callback token
components:
  securitySchemes:
    kailoSession:
      type: apiKey
      in: cookie
      name: kailopay_session
      description: Opaque KailoPay-owned session cookie. Provider tokens are never returned to the browser.
    kailoAPIKey:
      type: http
      scheme: bearer
      description: KailoPay sandbox key using the pk_test_ prefix.
    xenditCallback:
      type: apiKey
      in: header
      name: x-callback-token
  schemas:
    UserProfileResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      required: [id, display_name, email, email_verified, developer_enabled]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        developer_enabled:
          type: boolean
        avatar_url:
          type: string
          description: Authenticated relative URL for the private profile image; omitted when no avatar exists.
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [display_name]
        - required: [developer_enabled]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        developer_enabled:
          type: boolean
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    APIKeyMetadata:
      type: object
      required: [id, client_id, name, prefix, created_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    CreateAPIKeyResponse:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: object
          required: [id, client_id, prefix, key, created_at]
          properties:
            id: {type: string, format: uuid}
            client_id: {type: string, format: uuid}
            prefix: {type: string}
            key:
              type: string
              description: One-time plaintext sandbox key.
            created_at: {type: string, format: date-time}
    CreateOfframpRequest:
      type: object
      additionalProperties: false
      required: [asset, withdrawal]
      properties:
        asset:
          type: object
          additionalProperties: false
          required: [network, code, amount]
          properties:
            network:
              type: string
              enum: [stellar_testnet]
            code:
              type: string
              enum: [XLM]
            amount:
              type: string
              description: Exact decimal XLM amount with up to 7 fraction digits.
        withdrawal:
          type: object
          additionalProperties: false
          required: [currency, method]
          properties:
            currency:
              type: string
              enum: [IDR]
            method:
              type: string
              enum: [sandbox_bank_transfer]
            destination_token:
              type: string
              maxLength: 200
              description: Synthetic sandbox destination reference; never real bank details.
    CreateOnrampRequest:
      type: object
      additionalProperties: false
      required: [fiat, stellar_destination]
      properties:
        fiat:
          type: object
          required: [currency, amount_minor]
          properties:
            currency: {type: string, enum: [IDR]}
            amount_minor: {type: string, pattern: '^[1-9][0-9]*$'}
        payment_method:
          type: string
          description: xendit opens the hosted checkout with all activated Xendit channels; qris and bri_va restrict it to one channel.
          enum: [xendit, qris, bri_va]
        stellar_destination:
          type: object
          required: [account]
          properties:
            account: {type: string, minLength: 56, maxLength: 56}
            memo: {type: string, nullable: true, maxLength: 28}
    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/Order'
    Order:
      type: object
      required: [id, status, environment, network, fiat, asset, quote, payment_method, stellar_destination, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [created, payment_pending, payment_confirmed, stellar_processing, completed, expired, payment_failed, stellar_failed, cancelled,
                 asset_pending, asset_received, asset_invalid, retirement_processing, withdrawal_processing,
                 retirement_failed, withdrawal_failed]
        environment: {type: string, enum: [sandbox]}
        network: {type: string, enum: [stellar_testnet]}
        fiat:
          type: object
          properties:
            currency: {type: string, enum: [IDR]}
            amount_minor: {type: string}
        asset:
          type: object
          properties:
            code: {type: string, enum: [XLM]}
            amount: {type: string, pattern: '^[0-9]+\.[0-9]{7}$'}
        quote:
          type: object
          properties:
            rate: {type: string}
            adjusted_rate: {type: string}
            spread_bps: {type: integer}
            source_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
        payment_method: {type: string, enum: [xendit, qris, bri_va]}
        stellar_destination:
          type: object
          properties:
            account: {type: string}
            memo: {type: string}
        checkout:
          type: object
          properties:
            id: {type: string}
            status: {type: string}
            presentation_type: {type: string, enum: [PAYMENT_LINK, QR_STRING, VIRTUAL_ACCOUNT_NUMBER]}
            presentation_value: {type: string}
            payment_link_url: {type: string, format: uri}
            expires_at: {type: string, format: date-time, nullable: true}
        stellar_transaction_hash: {type: string}
        deposit_transaction_hash: {type: string}
        payout:
          type: object
          properties:
            reference: {type: string}
            method: {type: string, enum: [sandbox_bank_transfer]}
            amount_minor: {type: string}
            state: {type: string, enum: [pending, completed, failed]}
            simulated: {type: boolean}
            disclosure: {type: string}
        failure_code: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        display_name:
          type: string
          maxLength: 100
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    EnvironmentMetadata:
      type: object
      required: [environment]
      properties:
        environment:
          type: string
          enum: [local, test, sandbox, production]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OnrampError:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_STELLAR_ACCOUNT, AMOUNT_OUT_OF_RANGE, INSUFFICIENT_LIQUIDITY,
                     IDEMPOTENCY_KEY_REUSED, ORDER_NOT_FOUND, CHECKOUT_PENDING_RECONCILIATION,
                     QUOTE_UNAVAILABLE, EXTERNAL_SERVICE_UNAVAILABLE]
            message:
              type: string
        request_id:
          type: string
        order_id:
          type: string
          format: uuid
          description: Durable order identifier returned when checkout creation has an unknown provider outcome; poll GET /v1/orders/{id}.
