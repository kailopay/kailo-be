openapi: 3.0.3
info:
  title: KailoPay Backend API
  version: 0.1.0
  description: |
    Sandbox/testnet payment and Stellar anchor API. Users complete Persona
    identity verification before they can create an API key or an on-ramp,
    off-ramp, or SEP-24 transaction. The current release does not move real
    fiat value.
servers:
  - url: http://localhost:8080
    description: Local development
tags:
  - name: Identity and KYC
    description: Local sessions and Persona identity-verification status.
  - name: Developer
    description: Sandbox API-key management.
  - name: Developer webhooks
    description: Register and disable sandbox order-event destinations.
  - name: Orders
    description: Authenticated on-ramp, off-ramp, and order operations.
  - name: SEP-24
    description: Authenticated sandbox deposit and withdrawal operations.
  - name: Anchor discovery
    description: Public Stellar testnet anchor metadata and federation lookup.
  - name: Provider callbacks
    description: Signed callbacks from Persona and Xendit.
paths:
  /auth/register:
    post:
      summary: Create an email account
      description: |
        Creates an unverified credentials account and issues a single-use
        verification token. When Gmail is enabled, the configured sender sends
        a KailoPay-branded email with an inline logo and HTML and plain-text
        versions. The default console sender logs the link instead.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Account created; verification required before login
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid JSON, email, or password (10-128 characters required)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/login:
    post:
      summary: Sign in with email and password
      description: Verifies credentials and sets the opaque session cookie. Unknown emails and wrong passwords both return 401 without distinguishing the cause.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user with session cookie
          headers:
            Set-Cookie:
              schema:
                type: string
              description: HttpOnly, SameSite=Lax local session cookie.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          description: Invalid email or password, or account locked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Email is not verified yet
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/login:
    get:
      summary: Start Google sign-in
      description: Redirects the browser to Google's OIDC authorization endpoint with PKCE. Returns 503 when Google credentials are not configured.
      responses:
        '302':
          description: Redirect to Google
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          description: Google sign-in is not configured
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/google/callback:
    get:
      summary: Complete Google sign-in
      description: Exchanges the Google authorization code and redirects to the frontend with a local session cookie. A Google identity whose verified email matches an existing account is linked to that account.
      responses:
        '302':
          description: Redirect to the configured frontend success URL
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly, SameSite=Lax local session cookie.
        '400':
          description: Invalid, expired, or replayed authentication callback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: End the local session
      description: Revokes the KailoPay session represented by the browser cookie and clears that cookie.
      responses:
        '204':
          description: Session ended or was already absent
        '500':
          description: Session revocation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/verify:
    post:
      summary: Verify an email address
      description: Consumes the single-use verification token from the register or resend flow. Verification tokens remain valid for 24 hours and can be used only once.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailTokenRequest'
      responses:
        '200':
          description: Verified profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '400':
          description: Invalid, expired, or already used token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/email/resend:
    post:
      summary: Resend the verification email
      description: |
        For an existing unverified account, reissues a single-use verification
        token and sends the KailoPay-branded verification email when Gmail is
        enabled. The default console sender logs the link instead. Always
        returns 202 regardless of whether the account exists or is already
        verified.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The request was accepted without disclosing account existence
        '400':
          description: Invalid JSON or email syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/forgot:
    post:
      summary: Request a password-reset email
      description: |
        For an existing account, issues a single-use reset token valid for one
        hour and sends the KailoPay-branded password-reset email when Gmail is
        enabled. The default console sender logs the link instead. A valid
        request always returns 202 regardless of whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The request was accepted without disclosing account existence
        '400':
          description: Invalid JSON or email syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/reset:
    post:
      summary: Reset the password with a token
      description: Consumes the single-use reset token, which remains valid for one hour, stores a new Argon2id hash, and revokes every session for the account.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '204':
          description: Password updated; all sessions revoked
        '400':
          description: Invalid token or password policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/change:
    post:
      summary: Change the password of the signed-in account
      description: Requires the current password, stores the new hash, and revokes every session including the current one.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeRequest'
      responses:
        '204':
          description: Password changed; sign in again
        '401':
          description: Missing session or wrong current password
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '400':
          description: Invalid JSON or password policy violation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      summary: Get the authenticated local user
      security:
        - kailoSession: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing, expired, revoked, or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update the authenticated local profile
      description: Updates the local display name and Developer Mode opt-in. Email and verification status are managed by the authentication flows.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid display name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me/avatar:
    get:
      summary: Read the authenticated user's private avatar
      security:
        - kailoSession: []
      responses:
        '200':
          description: Avatar bytes streamed from private object storage
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid local session
        '404':
          description: The user has no avatar
    put:
      summary: Replace the authenticated user's avatar
      description: Accepts one JPEG, PNG, or WebP image up to the configured size limit and stores it in the private MinIO bucket.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid image or multipart request
        '401':
          description: Missing or invalid local session
        '413':
          description: Avatar exceeds the configured size limit
    delete:
      summary: Delete the authenticated user's avatar
      security:
        - kailoSession: []
      responses:
        '200':
          description: Updated profile without an avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid local session
  /v1/kyc:
    get:
      tags: [Identity and KYC]
      operationId: getKYCStatus
      summary: Get the authenticated user's identity-verification status
      description: Returns the latest webhook-backed Persona status. Only approved is eligible to create API keys or on/off-ramp orders.
      security:
        - kailoSession: []
      responses:
        '200':
          description: Current KYC status without identity fields or provider secrets
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCStatusResponse'
        '401':
          description: Missing or invalid local session
        '500':
          description: Failed to read KYC status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCError'
  /v1/kyc/inquiry:
    post:
      tags: [Identity and KYC]
      operationId: createKYCInquiry
      summary: Create or resume the authenticated user's Persona inquiry
      description: Creates a backend-owned Persona inquiry or resumes the current inquiry. The optional session token is short-lived and intended only for the embedded browser flow.
      security:
        - kailoSession: []
      responses:
        '201':
          description: Persona inquiry details for the embedded flow
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCInquiryResponse'
        '401':
          description: Missing or invalid local session
        '503':
          description: Persona is temporarily unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCError'
        '500':
          description: Unexpected server failure
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KYCError'
  /v1/api-keys:
    post:
      tags: [Developer]
      operationId: createAPIKey
      summary: Create a sandbox API key
      description: Requires Developer Mode and an approved Persona identity verification. The full key is returned only in this response.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAPIKeyRequest'
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateAPIKeyResponse'
        '403':
          description: Developer Mode is disabled or approved identity verification is required (KYC_REQUIRED)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ErrorResponse'
                  - $ref: '#/components/schemas/KYCError'
    get:
      tags: [Developer]
      operationId: listAPIKeys
      summary: List sandbox API keys
      security:
        - kailoSession: []
      responses:
        '200':
          description: API-key metadata without secret values
          content:
            application/json:
              schema:
                type: object
                required: [api_keys]
                properties:
                  api_keys:
                    type: array
                    items:
                      $ref: '#/components/schemas/APIKeyMetadata'
  /v1/api-keys/{id}:
    delete:
      tags: [Developer]
      operationId: revokeAPIKey
      summary: Revoke a sandbox API key
      security:
        - kailoSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: API key revoked
        '404':
          description: Key not found for this user
  /v1/webhook-endpoints:
    post:
      tags: [Developer webhooks]
      operationId: createWebhookEndpoint
      summary: Register a sandbox webhook endpoint
      description: |
        Registers an HTTPS endpoint for sandbox order-lifecycle events. The
        endpoint must use a public host without embedded credentials. The
        signing secret is returned only once. Outbound delivery is staged for
        the next worker slice in the current release.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWebhookEndpointRequest'
      responses:
        '201':
          description: Endpoint registered; the signing secret is shown once
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateWebhookEndpointResponse'
        '400':
          description: Invalid JSON, URL, or event type
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Endpoint could not be stored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags: [Developer webhooks]
      operationId: listWebhookEndpoints
      summary: List the authenticated user's webhook endpoints
      description: Returns endpoint metadata without returning signing secrets.
      security:
        - kailoSession: []
      responses:
        '200':
          description: Webhook endpoint metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookEndpointListResponse'
        '401':
          description: Missing or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Endpoint list could not be read
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/webhook-endpoints/{id}:
    delete:
      tags: [Developer webhooks]
      operationId: disableWebhookEndpoint
      summary: Disable a webhook endpoint
      description: Disables the authenticated user's endpoint without deleting its delivery history.
      security:
        - kailoSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Endpoint disabled
        '401':
          description: Missing or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Endpoint not found for this user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Endpoint could not be disabled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /v1/onramps:
    post:
      tags: [Orders]
      operationId: createOnramp
      summary: Create an IDR to native-XLM sandbox on-ramp
      description: |
        Accepts either an API-key principal or a verified retail session
        principal. For a session-authenticated browser mutation, `Origin`
        must exactly match a configured frontend origin; when `Origin` is
        absent, an equivalent `Referer` origin is accepted.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOnrampRequest'
      responses:
        '200':
          description: Idempotent replay of a previously completed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '201':
          description: Treasury inventory reserved and Xendit hosted checkout created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '202':
          description: Checkout outcome is pending provider reconciliation (CHECKOUT_PENDING_RECONCILIATION)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '400':
          description: Malformed request (INVALID_REQUEST) or invalid Stellar destination (INVALID_STELLAR_ACCOUNT)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '401':
          description: Missing or invalid API key/session credentials
        '403':
          description: Verified session is required for consumer orders, the browser origin is not allowed, or approved identity verification is required (KYC_REQUIRED)
        '409':
          description: Idempotency conflict (IDEMPOTENCY_KEY_REUSED) or insufficient liquidity (INSUFFICIENT_LIQUIDITY)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '415':
          description: Content type is not application/json
        '422':
          description: Amount outside the supported range (AMOUNT_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '503':
          description: Quote unavailable (QUOTE_UNAVAILABLE) or an external service is unavailable (EXTERNAL_SERVICE_UNAVAILABLE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
  /v1/offramps:
    post:
      tags: [Orders]
      operationId: createOfframp
      summary: Create an XLM to IDR sandbox off-ramp (simulated payout)
      description: |
        Prices the sell order against current market data, then returns
        deterministic deposit instructions: send exactly the quoted XLM amount
        to the deposit account using the returned memo before expiry. After
        verification and on-chain retirement, a simulated IDR payout reference
        is recorded; no real IDR moves in the sandbox release. Accepts either
        an API-key principal or a verified retail session principal. A
        session-authenticated browser mutation requires an exact configured
        `Origin`, or a matching `Referer` origin when `Origin` is absent.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 255
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOfframpRequest'
      responses:
        '200':
          description: Idempotent replay of a previously completed request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '201':
          description: Order created with deposit instructions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: Malformed request or invalid withdrawal payload
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '401':
          description: Missing or invalid API key/session credentials
        '403':
          description: Verified session is required for consumer orders, the browser origin is not allowed, or approved identity verification is required (KYC_REQUIRED)
        '409':
          description: Idempotency conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '422':
          description: Resulting payout outside the supported range (AMOUNT_OUT_OF_RANGE)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
        '503':
          description: Quote unavailable or external service unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List orders owned by the authenticated principal
      description: API keys list their client-owned orders; retail sessions list that verified user's consumer orders across valid sessions.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
        - name: cursor
          in: query
          schema:
            type: string
      responses:
        '200':
          description: Orders owned by the authenticated API client or retail user
          content:
            application/json:
              schema:
                type: object
                required: [orders, next_cursor]
                properties:
                  orders:
                    type: array
                    items:
                      $ref: '#/components/schemas/Order'
                  next_cursor:
                    type: string
  /v1/orders/{id}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Get one order owned by the authenticated principal
      description: Returns 404 when the order does not exist or belongs to a different API client, retail user, or owner scope.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Order found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '401':
          description: Missing or invalid API key/session credentials
        '404':
          description: Missing or cross-client order (ORDER_NOT_FOUND)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OnrampError'
  /.well-known/stellar.toml:
    get:
      tags: [Anchor discovery]
      operationId: getStellarToml
      summary: Get the public Stellar testnet anchor descriptor
      description: Advertises only the configured sandbox/testnet SEP-24 transfer server, federation endpoint, and native XLM asset.
      responses:
        '200':
          description: Stellar TOML document
          content:
            application/x-stellar-toml:
              schema:
                type: string
  /federation:
    get:
      tags: [Anchor discovery]
      operationId: resolveFederation
      summary: Resolve a sandbox federation name
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
          description: Synthetic federation name in the documented `name*kailopay` form.
      responses:
        '200':
          description: Resolved testnet account and memo
          content:
            application/json:
              schema:
                type: object
                required: [stellar_address, memo, memo_type]
                properties:
                  stellar_address: {type: string}
                  memo: {type: string}
                  memo_type: {type: string, enum: [text]}
        '404':
          description: Unknown or malformed federation name
  /sep24/info:
    get:
      tags: [SEP-24]
      operationId: getSEP24Info
      summary: Get supported SEP-24 sandbox assets and limits
      description: Deposit limits use IDR minor units in this sandbox; withdrawal limits use exact XLM units.
      responses:
        '200':
          description: Supported testnet XLM deposit and withdrawal configuration
          content:
            application/json:
              schema:
                type: object
                required: [deposit, withdraw, fee]
                properties:
                  deposit:
                    $ref: '#/components/schemas/SEP24AssetInfoMap'
                  withdraw:
                    $ref: '#/components/schemas/SEP24AssetInfoMap'
                  fee:
                    type: object
  /sep24/transactions/deposit/interactive:
    post:
      tags: [SEP-24]
      summary: Start an authenticated SEP-24 deposit
      description: Creates an owner-scoped KailoPay on-ramp order after the normal approved-Persona KYC gate and persists the SEP-24 transaction mapping. The sandbox uses amount_minor IDR units because the order quote is fiat-denominated.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 240
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SEP24DepositRequest'
      responses:
        '200':
          description: Interactive transaction created or safely replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24StartResponse'
        '400':
          description: Invalid request or Stellar destination
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '401':
          description: Missing or invalid API key/session credentials
        '403':
          description: Approved Persona verification is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '409':
          description: Idempotency or mapping conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '422':
          description: Amount outside the configured range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '503':
          description: Quote, gateway, or persistence dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
  /sep24/transactions/withdraw/interactive:
    post:
      tags: [SEP-24]
      summary: Start an authenticated SEP-24 withdrawal
      description: Creates an owner-scoped KailoPay off-ramp order after the normal approved-Persona KYC gate and persists the SEP-24 transaction mapping. The sandbox payout rail uses a synthetic destination token.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 240
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/SEP24WithdrawRequest'
      responses:
        '200':
          description: Interactive transaction created or safely replayed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24StartResponse'
        '400':
          description: Invalid withdrawal request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '401':
          description: Missing or invalid API key/session credentials
        '403':
          description: Approved Persona verification is required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '409':
          description: Idempotency or mapping conflict
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '422':
          description: Resulting payout outside the configured range
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '503':
          description: Quote or persistence dependency unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
  /sep24/transaction:
    get:
      tags: [SEP-24]
      operationId: getSEP24Transaction
      summary: Get the current status of an owned SEP-24 transaction
      description: Loads the durable transaction-to-order mapping and returns the current order state. Client-supplied status values are ignored.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: id
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Current status for the authenticated owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24TransactionResponse'
        '400':
          description: Missing or invalid transaction ID
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '401':
          description: Missing or invalid API key/session credentials
        '404':
          description: Transaction is missing or belongs to another owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
        '503':
          description: Transaction or order storage unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
  /sep24/interactive/{id}:
    get:
      tags: [SEP-24]
      operationId: getSEP24InteractiveTransaction
      summary: Get the authenticated SEP-24 interactive projection
      description: Returns the same owner-scoped transaction state with sandbox and Stellar testnet labels. A wallet-facing HTML UI is not included in this backend slice.
      security:
        - kailoAPIKey: []
        - kailoSession: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Authenticated sandbox transaction projection
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24InteractiveResponse'
        '401':
          description: Missing or invalid API key/session credentials
        '404':
          description: Transaction is missing or belongs to another owner
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SEP24Error'
  /sep24/deposit:
    $ref: '#/paths/~1sep24~1transactions~1deposit~1interactive'
  /sep24/withdraw:
    $ref: '#/paths/~1sep24~1transactions~1withdraw~1interactive'
  /callbacks/kyc/persona:
    post:
      tags: [Provider callbacks]
      operationId: receivePersonaCallback
      summary: Receive signed Persona identity-verification events
      description: Verifies the Persona-Signature header over the exact raw JSON body, deduplicates provider events, and updates the local KYC status without storing the raw payload.
      security:
        - personaSignature: []
      parameters:
        - name: Persona-Signature
          in: header
          required: true
          schema:
            type: string
          description: Persona timestamped HMAC signature.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PersonaWebhookRequest'
      responses:
        '200':
          description: Callback accepted, replayed, or safely retained
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCallbackAccepted'
        '400':
          description: Callback body or event identity conflicts with the stored event
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCallbackError'
        '401':
          description: Missing, stale, or invalid Persona signature
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCallbackError'
        '503':
          description: Callback could not be durably processed and may be retried
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PersonaCallbackError'
  /callbacks/payments/xendit:
    post:
      tags: [Provider callbacks]
      operationId: receiveXenditCallback
      summary: Receive an authenticated Xendit payment webhook
      description: |
        Accepts Xendit `payment_session.completed`,
        `payment_session.expired`, and `payment.capture` callbacks. Payment
        Session callbacks may identify the session with either
        `data.payment_session_id` or the `data.id` field used by the Xendit
        dashboard test fixture. The backend correlates a callback by
        payment-session ID or payment-request ID, re-checks the provider
        state, and applies the payment transition idempotently before
        enqueueing Stellar settlement.
      security:
        - xenditCallback: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/XenditCallbackRequest'
      responses:
        '200':
          description: Callback accepted, replayed, or safely retained
        '401':
          description: Invalid callback token or malformed/unsupported callback payload
components:
  securitySchemes:
    kailoSession:
      type: apiKey
      in: cookie
      name: kailopay_session
      description: Opaque KailoPay-owned session cookie. Provider tokens are never returned to the browser.
    kailoAPIKey:
      type: http
      scheme: bearer
      description: KailoPay sandbox key using the pk_test_ prefix.
    xenditCallback:
      type: apiKey
      in: header
      name: x-callback-token
    personaSignature:
      type: apiKey
      in: header
      name: Persona-Signature
      description: Timestamped HMAC signature calculated by Persona over the exact callback body.
  schemas:
    UserProfileResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      required: [id, display_name, email, email_verified, developer_enabled]
      properties:
        id:
          type: string
          format: uuid
        display_name:
          type: string
        email:
          type: string
          format: email
        email_verified:
          type: boolean
        developer_enabled:
          type: boolean
        avatar_url:
          type: string
          description: Authenticated relative URL for the private profile image; omitted when no avatar exists.
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      anyOf:
        - required: [display_name]
        - required: [developer_enabled]
      properties:
        display_name:
          type: string
          minLength: 1
          maxLength: 100
        developer_enabled:
          type: boolean
    KYCStatusResponse:
      type: object
      required: [kyc]
      properties:
        kyc:
          $ref: '#/components/schemas/KYCStatus'
    KYCStatus:
      type: object
      required: [provider, status, provider_status, inquiry_id]
      properties:
        provider:
          type: string
          enum: [persona]
        status:
          type: string
          enum: [not_started, creating, created, pending, completed, pending_review, approved, declined, failed, expired]
        provider_status:
          type: string
        inquiry_id:
          type: string
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        expires_at:
          type: string
          format: date-time
          nullable: true
        approved_at:
          type: string
          format: date-time
          nullable: true
    KYCInquiryResponse:
      type: object
      required: [inquiry]
      properties:
        inquiry:
          $ref: '#/components/schemas/KYCInquiry'
    KYCInquiry:
      type: object
      required: [status, provider_status, inquiry_id, environment_id]
      properties:
        status:
          type: string
          enum: [created, pending, completed, pending_review, approved, declined, failed, expired]
        provider_status:
          type: string
        inquiry_id:
          type: string
        environment_id:
          type: string
        session_token:
          type: string
          description: Short-lived Persona embedded-flow session token. Returned only when the server resumes an existing inquiry.
        expires_at:
          type: string
          format: date-time
          nullable: true
    KYCError:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, KYC_PROVIDER_UNAVAILABLE, KYC_INQUIRY_NOT_FOUND, KYC_REQUIRED, INTERNAL_ERROR]
            message:
              type: string
        request_id:
          type: string
    PersonaWebhookRequest:
      type: object
      description: Persona JSON:API event payload. The server stores only event identity, timestamps, status, and a hash of the exact body.
      additionalProperties: true
      required: [data]
      properties:
        data:
          type: object
          required: [id, type, attributes]
          properties:
            id:
              type: string
            type:
              type: string
              enum: [event]
            attributes:
              type: object
              additionalProperties: true
    PersonaCallbackAccepted:
      type: object
      required: [status, request_id]
      properties:
        status:
          type: string
          enum: [accepted]
        request_id:
          type: string
    PersonaCallbackError:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message, retryable]
          properties:
            code:
              type: string
              enum: [INVALID_CALLBACK_BODY, INVALID_CALLBACK_SIGNATURE, CALLBACK_EVENT_CONFLICT, KYC_INQUIRY_NOT_FOUND, CALLBACK_PROCESSING_FAILED]
            message:
              type: string
            retryable:
              type: boolean
            details:
              type: string
              description: Safe local-development diagnostic. Omitted outside local mode.
        request_id:
          type: string
    CreateAPIKeyRequest:
      type: object
      additionalProperties: false
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
    APIKeyMetadata:
      type: object
      required: [id, client_id, name, prefix, created_at]
      properties:
        id: {type: string, format: uuid}
        client_id: {type: string, format: uuid}
        name: {type: string}
        prefix: {type: string}
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    CreateAPIKeyResponse:
      type: object
      required: [api_key]
      properties:
        api_key:
          type: object
          required: [id, client_id, prefix, key, created_at]
          properties:
            id: {type: string, format: uuid}
            client_id: {type: string, format: uuid}
            prefix: {type: string}
            key:
              type: string
              description: One-time plaintext sandbox key.
            created_at: {type: string, format: date-time}
    CreateOfframpRequest:
      type: object
      additionalProperties: false
      required: [asset, withdrawal]
      properties:
        asset:
          type: object
          additionalProperties: false
          required: [network, code, amount]
          properties:
            network:
              type: string
              enum: [stellar_testnet]
            code:
              type: string
              enum: [XLM]
            amount:
              type: string
              description: Exact decimal XLM amount with up to 7 fraction digits.
        withdrawal:
          type: object
          additionalProperties: false
          required: [currency, method]
          properties:
            currency:
              type: string
              enum: [IDR]
            method:
              type: string
              enum: [sandbox_bank_transfer]
            destination_token:
              type: string
              maxLength: 200
              description: Synthetic sandbox destination reference; never real bank details.
    CreateOnrampRequest:
      type: object
      additionalProperties: false
      required: [fiat, stellar_destination]
      properties:
        fiat:
          type: object
          required: [currency, amount_minor]
          properties:
            currency: {type: string, enum: [IDR]}
            amount_minor: {type: string, pattern: '^[1-9][0-9]*$'}
        payment_method:
          type: string
          description: xendit opens the hosted checkout with all activated Xendit channels, including QRIS and BRI Virtual Account when enabled on the merchant account; qris and bri_va restrict it to one channel.
          enum: [xendit, qris, bri_va]
        stellar_destination:
          type: object
          required: [account]
          properties:
            account: {type: string, minLength: 56, maxLength: 56}
            memo: {type: string, nullable: true, maxLength: 28}
    OrderResponse:
      type: object
      required: [order]
      properties:
        order:
          $ref: '#/components/schemas/Order'
    Order:
      type: object
      required: [id, status, environment, network, fiat, asset, quote, payment_method, stellar_destination, created_at, updated_at]
      properties:
        id: {type: string, format: uuid}
        status:
          type: string
          enum: [created, payment_pending, payment_confirmed, stellar_processing, completed, expired, payment_failed, stellar_failed, cancelled,
                 asset_pending, asset_received, asset_invalid, retirement_processing, withdrawal_processing,
                 retirement_failed, withdrawal_failed]
        environment: {type: string, enum: [sandbox]}
        network: {type: string, enum: [stellar_testnet]}
        fiat:
          type: object
          properties:
            currency: {type: string, enum: [IDR]}
            amount_minor: {type: string}
        asset:
          type: object
          properties:
            code: {type: string, enum: [XLM]}
            amount: {type: string, pattern: '^[0-9]+\.[0-9]{7}$'}
        quote:
          type: object
          properties:
            rate: {type: string}
            adjusted_rate: {type: string}
            spread_bps: {type: integer}
            source_at: {type: string, format: date-time}
            expires_at: {type: string, format: date-time}
        payment_method: {type: string, enum: [xendit, qris, bri_va]}
        stellar_destination:
          type: object
          properties:
            account: {type: string}
            memo: {type: string}
        checkout:
          type: object
          properties:
            id: {type: string}
            status: {type: string}
            presentation_type: {type: string, enum: [PAYMENT_LINK, QR_STRING, VIRTUAL_ACCOUNT_NUMBER]}
            presentation_value: {type: string}
            payment_link_url: {type: string, format: uri}
            expires_at: {type: string, format: date-time, nullable: true}
        stellar_transaction_hash: {type: string}
        deposit_transaction_hash: {type: string}
        payout:
          type: object
          properties:
            reference: {type: string}
            method: {type: string, enum: [sandbox_bank_transfer]}
            amount_minor: {type: string}
            state: {type: string, enum: [pending, completed, failed]}
            simulated: {type: boolean}
            disclosure: {type: string}
        failure_code: {type: string}
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 10
          maxLength: 128
        display_name:
          type: string
          maxLength: 100
    LoginRequest:
      type: object
      additionalProperties: false
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
    EmailTokenRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
    PasswordResetRequest:
      type: object
      additionalProperties: false
      required: [token, new_password]
      properties:
        token:
          type: string
          minLength: 1
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    PasswordChangeRequest:
      type: object
      additionalProperties: false
      required: [current_password, new_password]
      properties:
        current_password:
          type: string
        new_password:
          type: string
          minLength: 10
          maxLength: 128
    UserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    EnvironmentMetadata:
      type: object
      required: [environment]
      properties:
        environment:
          type: string
          enum: [local, test, sandbox, production]
    WebhookEventType:
      type: string
      enum:
        - order.created
        - order.payment_pending
        - order.payment_confirmed
        - order.asset_received
        - order.processing
        - order.completed
        - order.failed
        - order.expired
    CreateWebhookEndpointRequest:
      type: object
      additionalProperties: false
      required: [url]
      properties:
        url:
          type: string
          format: uri
          pattern: '^https://'
          maxLength: 2048
          description: HTTPS endpoint with a public host and no embedded credentials.
        event_types:
          type: array
          description: Order events to subscribe to. An omitted or empty list subscribes to every supported event.
          items:
            $ref: '#/components/schemas/WebhookEventType'
    WebhookEndpoint:
      type: object
      required: [id, url, status, event_types, created_at]
      properties:
        id:
          type: string
          format: uuid
        url:
          type: string
          format: uri
        status:
          type: string
          enum: [active, disabled]
        event_types:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEventType'
        created_at:
          type: string
          format: date-time
        disabled_at:
          type: string
          format: date-time
          nullable: true
    CreateWebhookEndpointResponse:
      type: object
      required: [endpoint, secret]
      properties:
        endpoint:
          type: object
          required: [id]
          properties:
            id:
              type: string
              format: uuid
        secret:
          type: string
          description: One-time plaintext signing secret. Store it securely; it is never returned again.
    WebhookEndpointListResponse:
      type: object
      required: [endpoints]
      properties:
        endpoints:
          type: array
          items:
            $ref: '#/components/schemas/WebhookEndpoint'
    SEP24AssetInfoMap:
      type: object
      required: [XLM]
      properties:
        XLM:
          type: object
          required: [enabled, min_amount, max_amount, amount_unit, fiat_currency]
          properties:
            enabled: {type: boolean}
            min_amount: {type: number}
            max_amount: {type: number}
            amount_unit: {type: string, enum: [XLM, idr_minor]}
            fiat_currency: {type: string, enum: [IDR]}
    SEP24DepositRequest:
      type: object
      additionalProperties: false
      required: [asset_code, amount_minor, account]
      properties:
        asset_code: {type: string, enum: [XLM]}
        amount_minor:
          type: string
          pattern: '^[1-9][0-9]*$'
          description: Positive IDR minor units; sandbox-specific input for the fiat-denominated quote flow.
        account:
          type: string
          minLength: 56
          maxLength: 56
          description: Stellar testnet destination account.
        memo: {type: string, maxLength: 28}
        memo_type: {type: string, enum: [text]}
        payment_method: {type: string, enum: [xendit, qris, bri_va]}
    SEP24WithdrawRequest:
      type: object
      additionalProperties: false
      required: [asset_code, amount, destination_token]
      properties:
        asset_code: {type: string, enum: [XLM]}
        amount:
          type: string
          pattern: '^[0-9]+(\.[0-9]{1,7})?$'
          description: Positive exact XLM amount with up to 7 fractional digits.
        destination_token:
          type: string
          minLength: 1
          maxLength: 200
          description: Synthetic sandbox destination reference; never real bank details.
    SEP24StartResponse:
      type: object
      required: [type, url, id, kyc_required, environment, network]
      properties:
        type: {type: string, enum: [interactive_customer_info_needed]}
        url: {type: string, format: uri}
        id: {type: string}
        kyc_required: {type: boolean, enum: [false]}
        environment: {type: string, enum: [sandbox]}
        network: {type: string, enum: [stellar_testnet]}
    SEP24Transaction:
      type: object
      required: [id, kind, status, started_at, updated_at]
      properties:
        id: {type: string}
        kind: {type: string, enum: [deposit, withdraw]}
        status:
          type: string
          enum: [pending_user_transfer_start, pending_anchor, pending_external, completed, expired, error]
        started_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
        stellar_transaction_id: {type: string}
        withdraw_anchor_account: {type: string}
        withdraw_memo: {type: string}
        withdraw_memo_type: {type: string, enum: [text]}
        amount_in: {type: string}
        more_info_url: {type: string, format: uri}
    SEP24TransactionResponse:
      type: object
      required: [transaction]
      properties:
        transaction:
          $ref: '#/components/schemas/SEP24Transaction'
    SEP24InteractiveResponse:
      type: object
      required: [environment, network, kyc_required, transaction]
      properties:
        environment: {type: string, enum: [sandbox]}
        network: {type: string, enum: [stellar_testnet]}
        kyc_required: {type: boolean, enum: [false]}
        transaction:
          $ref: '#/components/schemas/SEP24Transaction'
    SEP24Error:
      type: object
      required: [error, request_id]
      properties:
        error: {type: string}
        request_id: {type: string}
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
    OnrampError:
      type: object
      required: [error, request_id]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_REQUEST, INVALID_STELLAR_ACCOUNT, AMOUNT_OUT_OF_RANGE, INSUFFICIENT_LIQUIDITY,
                     IDEMPOTENCY_KEY_REUSED, ORDER_NOT_FOUND, CHECKOUT_PENDING_RECONCILIATION,
                     QUOTE_UNAVAILABLE, EXTERNAL_SERVICE_UNAVAILABLE, KYC_REQUIRED]
            message:
              type: string
        request_id:
          type: string
        order_id:
          type: string
          format: uuid
          description: Durable order identifier returned when checkout creation has an unknown provider outcome; poll GET /v1/orders/{id}.
    XenditCallbackRequest:
      oneOf:
        - $ref: '#/components/schemas/XenditPaymentSessionCallback'
        - $ref: '#/components/schemas/XenditPaymentCaptureCallback'
    XenditPaymentSessionCallback:
      type: object
      additionalProperties: true
      required: [event, data]
      properties:
        event:
          type: string
          enum: [payment_session.completed, payment_session.expired]
        data:
          type: object
          additionalProperties: true
          anyOf:
            - required: [payment_session_id]
            - required: [id]
          properties:
            id:
              type: string
              description: Payment Session identifier used by the Xendit dashboard test fixture.
            payment_session_id:
              type: string
              description: Payment Session identifier used by the provider callback payload.
    XenditPaymentCaptureCallback:
      type: object
      additionalProperties: true
      required: [event, data]
      properties:
        event:
          type: string
          enum: [payment.capture]
        data:
          type: object
          additionalProperties: true
          required: [payment_id]
          anyOf:
            - required: [payment_session_id]
            - required: [payment_request_id]
          properties:
            payment_id:
              type: string
            payment_session_id:
              type: string
            payment_request_id:
              type: string
