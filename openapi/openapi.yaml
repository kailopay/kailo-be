openapi: 3.0.3
info:
  title: KailoPay Backend API
  version: 0.1.0
  description: Sandbox/testnet payment API with Auth0 email login and KailoPay-owned sessions.
servers:
  - url: http://localhost:8080
    description: Local development
paths:
  /auth/login:
    get:
      summary: Start email login
      description: Redirects the browser to Auth0 Universal Login using the configured email connection.
      responses:
        '302':
          description: Redirect to Auth0
          headers:
            Location:
              schema:
                type: string
                format: uri
        '503':
          description: Authentication provider unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/callback:
    get:
      summary: Complete email login
      description: Consumes the Auth0 authorization callback and redirects to the frontend with a local session cookie.
      responses:
        '302':
          description: Redirect to the configured frontend success URL
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
                description: HttpOnly, SameSite=Lax local session cookie.
        '400':
          description: Invalid or replayed authentication callback
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/logout:
    post:
      summary: End the local session
      description: Revokes the KailoPay session represented by the browser cookie and clears that cookie.
      responses:
        '204':
          description: Session ended or was already absent
        '500':
          description: Session revocation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/password/forgot:
    post:
      summary: Request a password-reset email
      description: Requests Auth0 to send its hosted password-reset link. A valid request always returns 202 regardless of whether the account exists.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotPasswordRequest'
      responses:
        '202':
          description: The request was accepted without disclosing account existence
        '400':
          description: Invalid JSON or email syntax
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me:
    get:
      summary: Get the authenticated local user
      security:
        - kailoSession: []
      responses:
        '200':
          description: Authenticated user profile
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/UserProfile'
        '401':
          description: Missing, expired, revoked, or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update the authenticated local profile
      description: Updates the local display name. Email and verification status remain Auth0-managed.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid display name
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or invalid local session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /auth/me/avatar:
    get:
      summary: Read the authenticated user's private avatar
      security:
        - kailoSession: []
      responses:
        '200':
          description: Avatar bytes streamed from private object storage
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '401':
          description: Missing or invalid local session
        '404':
          description: The user has no avatar
    put:
      summary: Replace the authenticated user's avatar
      description: Accepts one JPEG, PNG, or WebP image up to the configured size limit and stores it in the private MinIO bucket.
      security:
        - kailoSession: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [avatar]
              properties:
                avatar:
                  type: string
                  format: binary
      responses:
        '200':
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '400':
          description: Invalid image or multipart request
        '401':
          description: Missing or invalid local session
        '413':
          description: Avatar exceeds the configured size limit
    delete:
      summary: Delete the authenticated user's avatar
      security:
        - kailoSession: []
      responses:
        '200':
          description: Updated profile without an avatar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfileResponse'
        '401':
          description: Missing or invalid local session
  /internal/auth/password-reset-completed:
    post:
      summary: Revoke local sessions after an Auth0 password reset
      description: Internal Auth0 Action callback. It is not intended for browser clients.
      security:
        - passwordResetWebhook: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetCompletedRequest'
      responses:
        '204':
          description: All local sessions for the Auth0 identity were revoked
        '401':
          description: Missing or invalid callback secret
components:
  securitySchemes:
    kailoSession:
      type: apiKey
      in: cookie
      name: kailopay_session
      description: Opaque KailoPay-owned session cookie. Auth0 tokens are never returned to the browser.
    passwordResetWebhook:
      type: http
      scheme: bearer
      description: Dedicated Auth0 Action callback secret; never use an end-user token.
  schemas:
    UserProfileResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserProfile'
    UserProfile:
      type: object
      required: [id, displayName, email, emailVerified, developerEnabled]
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
        email:
          type: string
          format: email
        emailVerified:
          type: boolean
        developerEnabled:
          type: boolean
        avatarUrl:
          type: string
          description: Authenticated relative URL for the private profile image; omitted when no avatar exists.
    UpdateProfileRequest:
      type: object
      additionalProperties: false
      required: [displayName]
      properties:
        displayName:
          type: string
          minLength: 1
          maxLength: 100
    ForgotPasswordRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          type: string
          format: email
          maxLength: 254
    PasswordResetCompletedRequest:
      type: object
      additionalProperties: false
      required: [subject]
      properties:
        subject:
          type: string
          minLength: 1
    EnvironmentMetadata:
      type: object
      required: [environment]
      properties:
        environment:
          type: string
          enum: [local, test, sandbox, production]
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
