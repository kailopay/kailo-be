name: kailopay

x-app-environment: &app-environment
  APP_ENV: ${APP_ENV:-production}
  APP_VERSION: ${APP_VERSION:-0.1.0}
  HTTP_ADDRESS: ${HTTP_ADDRESS:-:8080}
  HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
  HTTP_READ_TIMEOUT: ${HTTP_READ_TIMEOUT:-15s}
  HTTP_WRITE_TIMEOUT: ${HTTP_WRITE_TIMEOUT:-15s}
  HTTP_IDLE_TIMEOUT: ${HTTP_IDLE_TIMEOUT:-60s}
  HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
  HTTP_ALLOWED_ORIGINS: ${HTTP_ALLOWED_ORIGINS:-}
  HEALTH_CHECK_TIMEOUT: ${HEALTH_CHECK_TIMEOUT:-2s}
  DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
  DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-10}
  DATABASE_CONN_MAX_LIFETIME: ${DATABASE_CONN_MAX_LIFETIME:-30m}
  DATABASE_CONN_MAX_IDLE_TIME: ${DATABASE_CONN_MAX_IDLE_TIME:-5m}
  DATABASE_PING_TIMEOUT: ${DATABASE_PING_TIMEOUT:-3s}
  MINIO_BUCKET: ${MINIO_BUCKET:-kailopay-profile}
  MINIO_REGION: ${MINIO_REGION:-us-east-1}
  PROFILE_AVATAR_MAX_BYTES: ${PROFILE_AVATAR_MAX_BYTES:-5242880}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  AUTH_SUCCESS_REDIRECT_URL: ${AUTH_SUCCESS_REDIRECT_URL:-}
  AUTH_EMAIL_LINK_BASE_URL: ${AUTH_EMAIL_LINK_BASE_URL:-}
  AUTH_TRANSACTION_ENCRYPTION_KEY: ${AUTH_TRANSACTION_ENCRYPTION_KEY:-}
  AUTH_SESSION_HMAC_KEY: ${AUTH_SESSION_HMAC_KEY:-}
  AUTH_SESSION_ABSOLUTE_LIFETIME: ${AUTH_SESSION_ABSOLUTE_LIFETIME:-8h}
  AUTH_SESSION_IDLE_LIFETIME: ${AUTH_SESSION_IDLE_LIFETIME:-30m}
  AUTH_TRANSACTION_LIFETIME: ${AUTH_TRANSACTION_LIFETIME:-10m}
  AUTH_COOKIE_NAME: ${AUTH_COOKIE_NAME:-kailopay_session}
  AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-console}
  GMAIL_USERNAME: ${GMAIL_USERNAME:-}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
  GMAIL_FROM_NAME: ${GMAIL_FROM_NAME:-KailoPay}
  GMAIL_SMTP_TIMEOUT: ${GMAIL_SMTP_TIMEOUT:-10s}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_REDIRECT_URL: ${GOOGLE_REDIRECT_URL:-}
  API_KEY_PEPPER: ${API_KEY_PEPPER:-}
  COINMARKETCAP_BASE_URL: ${COINMARKETCAP_BASE_URL:-https://pro-api.coinmarketcap.com}
  COINMARKETCAP_API_KEY: ${COINMARKETCAP_API_KEY:-}
  COINMARKETCAP_TIMEOUT: ${COINMARKETCAP_TIMEOUT:-5s}
  QUOTE_TTL: ${QUOTE_TTL:-5m}
  QUOTE_MAX_AGE: ${QUOTE_MAX_AGE:-2m}
  QUOTE_SPREAD_BPS: ${QUOTE_SPREAD_BPS:-0}
  ORDER_MIN_IDR: ${ORDER_MIN_IDR:-10000}
  ORDER_MAX_IDR: ${ORDER_MAX_IDR:-10000000}
  XENDIT_BASE_URL: ${XENDIT_BASE_URL:-https://api.xendit.co}
  XENDIT_SECRET_KEY: ${XENDIT_SECRET_KEY:-}
  XENDIT_CALLBACK_TOKEN: ${XENDIT_CALLBACK_TOKEN:-}
  XENDIT_API_VERSION: ${XENDIT_API_VERSION:-2024-11-11}
  XENDIT_QRIS_CHANNEL: ${XENDIT_QRIS_CHANNEL:-QRIS}
  XENDIT_VA_CHANNEL: ${XENDIT_VA_CHANNEL:-BRI_VIRTUAL_ACCOUNT}
  XENDIT_TIMEOUT: ${XENDIT_TIMEOUT:-10s}
  STELLAR_HORIZON_URL: ${STELLAR_HORIZON_URL:-https://horizon-testnet.stellar.org}
  STELLAR_NETWORK_PASSPHRASE: ${STELLAR_NETWORK_PASSPHRASE:-Test SDF Network ; September 2015}
  STELLAR_TREASURY_ACCOUNT: ${STELLAR_TREASURY_ACCOUNT:-}
  OFFRAMP_DEPOSIT_ACCOUNT: ${OFFRAMP_DEPOSIT_ACCOUNT:-}
  OFFRAMP_DEPOSIT_EXPIRY: ${OFFRAMP_DEPOSIT_EXPIRY:-24h}
  STELLAR_OPERATING_BUFFER_STROOPS: ${STELLAR_OPERATING_BUFFER_STROOPS:-10000000}
  STELLAR_TIMEOUT: ${STELLAR_TIMEOUT:-10s}
  WORKER_POLL_INTERVAL: ${WORKER_POLL_INTERVAL:-1s}
  WORKER_LEASE_DURATION: ${WORKER_LEASE_DURATION:-30s}
  WORKER_RETRY_DELAY: ${WORKER_RETRY_DELAY:-5s}
  WORKER_SUBMISSION_TIMEOUT: ${WORKER_SUBMISSION_TIMEOUT:-1m}
  WORKER_MAX_ATTEMPTS: ${WORKER_MAX_ATTEMPTS:-5}

services:
  postgres:
    image: postgres:18.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/18/docker
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1
    restart: unless-stopped
    command: server /data --address ":9000" --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
      MC_HOST_local: https://${MINIO_ROOT_USER}:${MINIO_ROOT_PASSWORD}@127.0.0.1:9000
    expose:
      - "9000"
      - "9001"
    volumes:
      - minio_data:/data
      - ${MINIO_CERTS_DIR:-./.minio-certs}:/root/.minio/certs:ro
    healthcheck:
      test: ["CMD-SHELL", "mc ready local --insecure"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    networks:
      - backend

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KAILOPAY_IMAGE:-kailopay:local}
    command: ["/app/migrate"]
    restart: "no"
    environment:
      <<: *app-environment
      DATABASE_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&TimeZone=UTC"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "true"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KAILOPAY_IMAGE:-kailopay:local}
    restart: unless-stopped
    environment:
      <<: *app-environment
      DATABASE_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&TimeZone=UTC"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "true"
    secrets:
      - source: minio_ca
        target: /etc/ssl/certs/minio-ca.crt
    ports:
      - "127.0.0.1:${API_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/readyz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: ${KAILOPAY_IMAGE:-kailopay:local}
    restart: unless-stopped
    command: ["/app/worker"]
    environment:
      <<: *app-environment
      DATABASE_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable&TimeZone=UTC"
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_USE_SSL: "true"
      STELLAR_TREASURY_SECRET: ${STELLAR_TREASURY_SECRET:?STELLAR_TREASURY_SECRET is required}
      OFFRAMP_DEPOSIT_SECRET: ${OFFRAMP_DEPOSIT_SECRET:?OFFRAMP_DEPOSIT_SECRET is required}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - backend

volumes:
  postgres_data:
  minio_data:

secrets:
  minio_ca:
    file: ${MINIO_CERTS_DIR:-./.minio-certs}/ca.crt

networks:
  backend:
    driver: bridge
