name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: build, vet, unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Unit tests (race enabled)
        run: |
          packages=$(go list ./... | grep -v '/internal/repository$')
          set +e
          go test -race -json $packages > "$RUNNER_TEMP/race-tests.json"
          status=$?
          set -e

          if [ "$status" -ne 0 ]; then
            jq -rs '
              [ .[] | select(.Action == "fail")
                | (.Package // "unknown package") + (if .Test == null then "" else "/" + .Test end)
              ]
              | unique[]
              | "::error::Race test failed: " + .
            ' "$RUNNER_TEMP/race-tests.json"

            {
              printf '## Race-test failure details\n\n'
              jq -rs '
                group_by((.Package // "") + "\u0000" + (.Test // ""))[]
                | select(any(.[]; .Action == "fail"))
                | "### " + (.[0].Package // "unknown package") + " / " + (.[0].Test // "package") + "\n\n"
                  + ([.[] | select(.Action == "output") | .Output] | join(""))
                  + "\n"
              ' "$RUNNER_TEMP/race-tests.json"
            } >> "$GITHUB_STEP_SUMMARY"
            exit "$status"
          fi

  integration:
    name: postgres integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kailopay_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kailopay_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_DSN: host=localhost user=postgres password=postgres dbname=kailopay_test port=5432 sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Apply migrations and run integration suite
        run: go test -race ./internal/repository/ -count=1 -v

  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            log_range="${PR_BASE_SHA}..${EVENT_SHA}"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            log_range="${EVENT_BEFORE}..${EVENT_SHA}"
          else
            log_range="--all"
          fi

          docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:b109bc5f8f76a38196a3e413704fc5b9e3c32360bce4e4b603bd6f45b3721dbb \
            git --log-opts="$log_range" --redact --verbose /repo
